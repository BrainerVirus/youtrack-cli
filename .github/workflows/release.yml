name: Release

# Builds and publishes a GitHub release with goreleaser when a v* tag is pushed
# (`make release VERSION=vX.Y.Z`). workflow_dispatch re-runs it for an existing tag
# and must be dispatched from that tag (`gh workflow run release.yml --ref vX.Y.Z
# -f tag=vX.Y.Z`): the signing identity is the dispatch ref, and ytrack upgrade
# and the install scripts accept only refs/tags/vX.Y.Z[-pre].
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag name
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-pre)"
            exit 1
          fi
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::dispatch the release from its tag: gh workflow run release.yml --ref $TAG -f tag=$TAG (got $REF)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # cosign keyless: sign the checksums with this workflow's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0 # the changelog needs the history and the previous tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache in the job that holds a write token
      # Runs repo code, so it happens here rather than as a goreleaser hook in
      # the step that holds HOMEBREW_TAP_GITHUB_TOKEN.
      - name: Generate shell completions
        run: make completions
      # goreleaser's `signs` runs cosign on the checksums file. The certificate
      # identity is https://github.com/BrainerVirus/youtrack-cli/.github/workflows/release.yml@<ref>
      # (issuer https://token.actions.githubusercontent.com), which
      # internal/upgrade.ReleaseIdentity and the install scripts pin.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: when the secret is absent this is empty and goreleaser skips
          # the Homebrew cask upload (skip_upload in .goreleaser.yaml).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
