name: OpenAPI contract

# Checks api/contract/youtrack-contract.json against the live REST API
# descriptions of the YouTrack versions users run: youtrack.jetbrains.com
# (JetBrains' own instance, ahead of Cloud) and a YouTrack Cloud instance.
# YouTrack Server has no public instance to download a description from, so
# it is not checked here. The schemas are downloaded at run time and never
# committed; api/contract/openapi-snapshot.json keeps a digest, and what
# changed against it upstream (new, removed or deprecated operations and
# attributes) goes to the run summary without failing the check.
# Drift opens (or comments on) one `api-drift` issue with the mismatch, so a
# change on JetBrains' side reaches the maintainer as a normal notification;
# the next clean run closes it.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the contract against each description
        id: check
        env:
          # One "name url" per line; every listed description is checked.
          SPECS: |
            youtrack.jetbrains.com https://youtrack.jetbrains.com/api/openapi.json
            youtrack-cloud https://cristhoferpincetti.youtrack.cloud/api/openapi.json
        run: |
          set -o pipefail
          status=0
          : > "$RUNNER_TEMP/contract.log"
          while read -r name url; do
            [ -n "$name" ] || continue
            echo "::group::$name ($url)"
            spec="$RUNNER_TEMP/$name.json"
            if ! curl --fail --silent --show-error --location --retry 3 -o "$spec" "$url"; then
              echo "[$name] contract check: could not download $url" | tee -a "$RUNNER_TEMP/contract.log"
              status=1
              echo "::endgroup::"
              continue
            fi
            YTRACK_OPENAPI="$spec" go test ./internal/youtrack/adapter/ -run 'TestContractMatchesOpenAPI|TestOpenAPICheckCatchesDrift|TestOpenAPICheckCatchesReadOnlyWrites' -count=1 -v 2>&1 |
              sed "s/^/[$name] /" | tee -a "$RUNNER_TEMP/contract.log" || status=1
            # Informational: never changes the outcome.
            YTRACK_OPENAPI="$spec" YTRACK_OPENAPI_NAME="$name" YTRACK_OPENAPI_SUMMARY="$GITHUB_STEP_SUMMARY" \
              go test ./internal/youtrack/contract/ -run '^TestUpstreamChanges$' -count=1 -v || true
            echo "::endgroup::"
          done <<< "$SPECS"
          exit "$status"
      - name: Open or update the api-drift issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-drift --force --color B60205 \
            --description "YouTrack's REST API no longer matches ytrack's contract" >/dev/null
          {
            printf "The weekly contract check found that a live YouTrack OpenAPI description no longer matches \`api/contract/youtrack-contract.json\` (each line names the description in brackets).\n\n"
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'Mismatch (from the test output):\n\n```text\n'
            grep -E 'contract|missing|mismatch|drift|readOnly|FAIL|_test.go:[0-9]+' "$RUNNER_TEMP/contract.log" | head -80
            printf '```\n\nNext step: decide per item whether ytrack must change (a rename, a new required field, a removed endpoint, an attribute it writes turned readOnly) or the contract entry is stale, then fix it and rerun this workflow; a clean run closes this issue.\n'
          } > "$RUNNER_TEMP/body.md"
          open=$(gh issue list --label api-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "YouTrack API drift: contract check failed" --label api-drift --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Close a resolved api-drift issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label api-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The contract check passes again: $RUN_URL"
          done
