name: OpenAPI contract

# Checks api/contract/youtrack-contract.json against YouTrack's live REST API
# description. The schema is downloaded at run time and never committed.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download the live OpenAPI description
        run: curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/openapi.json" https://youtrack.jetbrains.com/api/openapi.json
      - name: Check the contract against it
        env:
          YTRACK_OPENAPI: ${{ runner.temp }}/openapi.json
        run: go test ./internal/youtrack/adapter/ -run 'TestContractMatchesOpenAPI|TestOpenAPICheckCatchesDrift' -count=1 -v
