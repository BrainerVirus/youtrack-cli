name: CI

# Docs-only changes skip CI (README.md and skills/ stay in: tests read them).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

# A new push to a PR cancels its older run; every main commit gets its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # golangci-lint's `standard` set (.golangci.yml) includes govet.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: go.mod and go.sum match the code
        run: go mod tidy -diff
      # golangci-lint's `unused` sees only unexported code; deadcode follows
      # the whole program from main and the tests, exported code included.
      - name: No unreachable code
        run: |
          out="$(go tool -modfile=tools/go.mod deadcode -test ./...)"
          if [ -n "$out" ]; then
            printf 'unreachable code (deadcode):\n%s\n' "$out"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
        if: runner.os != 'Linux'
      # The race detector needs cgo, which the Windows runner lacks by default.
      - run: go test -race ./...
        if: runner.os == 'Linux'
