name: Vulnerabilities

# govulncheck reports known vulnerabilities that ytrack's code actually
# reaches. New advisories appear without any change here, so it also runs
# weekly; a code or dependency change runs it at once.
on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "tools/**", ".github/workflows/vulncheck.yml"]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", "tools/**", ".github/workflows/vulncheck.yml"]
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod govulncheck ./...
